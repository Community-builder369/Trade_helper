services:
  - type: web
    name: cr-cognivex-market-api
    runtime: python
    plan: free
    buildCommand: cd cognivex-backend && pip install -r requirements.txt
    startCommand: cd cognivex-backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
